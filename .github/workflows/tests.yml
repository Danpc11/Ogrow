name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is the system Python of macOS used for the stamped
          # numbers; GitHub publishes it for Ubuntu 24.04 but not for 26.04
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Static analysis
        run: python -m pyflakes src scripts figures tests
      - name: Smoke tests and derivations
        run: make test

  paper:
    name: version and stamped numbers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version and the stamp of PAPER_NUMBERS.md
        run: python scripts/check_consistency.py
