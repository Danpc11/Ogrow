[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organgrow"
version = "1.0.0"
description = "Generative growth of exchange organs and the invariant-space metric"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "Pillow", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]
