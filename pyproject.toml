[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organgrow"
version = "4.64.0"
description = "Perfusion-limited growth of vascularised tissue from one nucleation law"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib", "Pillow", "PyYAML", "nibabel"]

[tool.setuptools.packages.find]
where = ["src"]
